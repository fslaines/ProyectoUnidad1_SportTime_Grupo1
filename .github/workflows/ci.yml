name: CI
on: [pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que existen los archivos
        run: test -f frontend/index.html && test -f frontend/app.js
      - name: Validar sintaxis de JavaScript
        run: node --check frontend/app.js
      - name: Validar sintaxis del pago compartido
        run: node --check frontend/pago-compartido.js