<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cancha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>cancha.</h1>
  <p>Centro Deportivo El Río · Av. Principal, 12 · Madrid</p>

  <section>
    <label>Fecha <input type="date" id="fecha"></label>
    <label>Cancha <select id="cancha"></select></label>
    <label>Duración
      <select id="duracion">
        <option value="1">1 hora</option>
        <option value="2">2 horas</option>
        <option value="3">3 horas</option>
        <option value="4">4 horas</option>
      </select>
    </label>
    <p id="precio"></p>
  </section>

  <section>
    <h2>Horarios</h2>
    <div id="horarios"></div>
  </section>

  <p id="mensaje"></p>

<section id="pago-compartido">
    <h2>Pago compartido</h2>
    <p>Reserva de ejemplo: Cancha 01 · Exterior, 4 horas × US$1 = US$4</p>
    <label>Participantes
      <select id="num-participantes">
        <option value="2">2</option>
        <option value="4">4</option>
      </select>
    </label>
    <button id="btn-crear">Dividir pago</button>
    <p>Plazo para completar los aportes: 2 horas.</p>
    <div id="aportes"></div>
    <p id="resumen"></p>
    <button id="btn-completar" disabled>Completar reserva</button>
    <p id="msg-pago"></p>
  </section>

  <script src="app.js"></script>
  <script src="pago-compartido.js"></script>
</body>
</html>
